<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/hnm-logo.svg" />
    <title>HNM Food Groups — Organic Millet Cereals | Cardiff, Wales</title>
    <meta name="description" content="HNM Food Groups — clean-label, naturally sourced organic millet breakfast cereals crafted for modern nutritional standards. Based in Cardiff, Wales." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body { overflow-x: hidden; max-width: 100vw; }
    </style>
  </head>
  <body className="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ArivuLabs Voice Widget -->
    <script>
    (function () {
      var config = {
        "orgSlug": "hnm-food-group",
        "agentSlug": "aditi",
        "apiUrl": "https://api.arivulabs.ai",
        "appUrl": "https://app.arivulabs.ai",
        "theme": {
          "position": "bottom-right",
          "primaryColor": "#111111",
          "secondaryColor": "#ffffff",
          "icon": "phone",
          "label": "Voice call",
          "panelTitle": "Aditi",
          "panelSubtitle": "HNM Food Group AI Receptionist",
          "launcherStyle": "pill"
        }
      };

      function constrainWidget() {
        // Find the widget's outermost container — it's the last fixed div appended to body
        var allFixed = Array.from(document.querySelectorAll('body > div')).filter(function(el) {
          var s = window.getComputedStyle(el);
          return s.position === 'fixed' || el.id.includes('arivu') || (el.className && el.className.includes && el.className.includes('arivu'));
        });
        allFixed.forEach(function(el) {
          // Only target widget divs not our React root
          if (el.id === 'root') return;
          var maxH = Math.min(560, window.innerHeight - 80);
          var maxW = Math.min(340, window.innerWidth - 32);
          el.style.cssText += [
            'position:fixed!important',
            'bottom:16px!important',
            'right:16px!important',
            'left:auto!important',
            'top:auto!important',
            'max-width:' + maxW + 'px!important',
            'width:' + maxW + 'px!important',
            'max-height:' + maxH + 'px!important',
            'overflow-y:auto!important',
            'overflow-x:hidden!important',
            'z-index:9999!important',
            'box-sizing:border-box!important',
          ].join(';');
          // Also constrain all children
          el.querySelectorAll('*').forEach(function(child) {
            child.style.maxWidth = '100%';
            child.style.boxSizing = 'border-box';
          });
        });
      }

      var script = document.createElement('script');
      script.src = 'https://api.arivulabs.ai/widget/arivu-widget.js';
      script.async = true;
      script.onload = function () {
        if (window.ArivuWidget) {
          window.ArivuWidget.init(config);
          // Run constraint after init and on mutations
          setTimeout(constrainWidget, 600);
          setTimeout(constrainWidget, 1500);
          var observer = new MutationObserver(function() { constrainWidget(); });
          observer.observe(document.body, { childList: true, subtree: false });
        }
      };
      document.body.appendChild(script);
    })();
    </script>
  </body>
</html>
