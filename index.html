<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/hnm-logo.svg" />
    <title>HNM Food Groups — Organic Millet Cereals | Cardiff, Wales</title>
    <meta name="description" content="HNM Food Groups — clean-label, naturally sourced organic millet breakfast cereals crafted for modern nutritional standards. Based in Cardiff, Wales." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body { overflow-x: hidden; max-width: 100vw; }
    </style>
  </head>
  <body className="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ArivuLabs Voice Widget -->
    <script>
    (function () {
      var config = {
        "orgSlug": "hnm-food-group",
        "agentSlug": "aditi",
        "apiUrl": "https://api.arivulabs.ai",
        "appUrl": "https://app.arivulabs.ai",
        "theme": {
          "position": "bottom-right",
          "primaryColor": "#111111",
          "secondaryColor": "#ffffff",
          "icon": "phone",
          "label": "Voice call",
          "panelTitle": "Aditi",
          "panelSubtitle": "HNM Food Group AI Receptionist",
          "launcherStyle": "pill"
        }
      };

      function applyWidgetStyles() {
        // Find every direct child of body that is NOT our React root
        var bodyChildren = Array.from(document.body.children);
        bodyChildren.forEach(function(el) {
          if (el.id === 'root' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return;
          var computed = window.getComputedStyle(el);
          // Target fixed/absolute positioned elements (the widget)
          if (computed.position === 'fixed' || computed.position === 'absolute' ||
              (el.id && el.id.toLowerCase().includes('arivu')) ||
              (typeof el.className === 'string' && el.className.toLowerCase().includes('arivu'))) {

            // Scale down to ~65% — anchored bottom-right
            el.style.cssText = [
              'position:fixed',
              'bottom:16px',
              'right:16px',
              'left:auto',
              'top:auto',
              'transform:scale(0.72)',
              'transform-origin:bottom right',
              'z-index:9999',
              'max-width:420px',
              'width:420px',
              'overflow:visible',
            ].join('!important;') + '!important';
          }
        });
      }

      var script = document.createElement('script');
      script.src = 'https://api.arivulabs.ai/widget/arivu-widget.js';
      script.async = true;
      script.onload = function () {
        if (window.ArivuWidget) {
          window.ArivuWidget.init(config);
          // Apply immediately, then again after panel renders
          setTimeout(applyWidgetStyles, 300);
          setTimeout(applyWidgetStyles, 800);
          setTimeout(applyWidgetStyles, 2000);
          // Watch for new widget children (panel open/close)
          var obs = new MutationObserver(function() { applyWidgetStyles(); });
          obs.observe(document.body, { childList: true, subtree: false, attributes: false });
        }
      };
      document.body.appendChild(script);
    })();
    </script>
  </body>
</html>
