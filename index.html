<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/hnm-logo.svg" />
    <title>HNM Food Groups — Organic Millet Cereals | Cardiff, Wales</title>
    <meta name="description" content="HNM Food Groups — clean-label, naturally sourced organic millet breakfast cereals crafted for modern nutritional standards. Based in Cardiff, Wales." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ── Prevent widget from affecting page layout ── */
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
      }

      /* Force every arivu element to be fixed + isolated */
      #arivu-widget-root,
      #arivu-widget-container,
      #arivu-launcher,
      div[id*="arivu"],
      div[class*="arivu"] {
        position: fixed !important;
        bottom: 16px !important;
        right: 16px !important;
        left: auto !important;
        top: auto !important;
        width: auto !important;
        max-width: min(360px, calc(100vw - 32px)) !important;
        z-index: 9999 !important;
        box-sizing: border-box !important;
        transform-origin: bottom right !important;
      }

      /* Panel (open state) */
      div[class*="panel"],
      div[class*="Panel"],
      div[id*="panel"],
      div[id*="Panel"] {
        max-width: min(360px, calc(100vw - 32px)) !important;
        max-height: calc(100svh - 100px) !important;
        width: min(360px, calc(100vw - 32px)) !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        right: 0 !important;
        left: auto !important;
      }

      /* Scale down on small screens */
      @media (max-width: 420px) {
        div[id*="arivu"],
        div[class*="arivu"] {
          transform: scale(0.88) !important;
          transform-origin: bottom right !important;
          right: 0px !important;
          bottom: 0px !important;
        }
      }
    </style>
  </head>
  <body className="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ArivuLabs Voice Widget -->
    <script>
    (function () {
      var config = {
        "orgSlug": "hnm-food-group",
        "agentSlug": "aditi",
        "apiUrl": "https://api.arivulabs.ai",
        "appUrl": "https://app.arivulabs.ai",
        "theme": {
          "position": "bottom-right",
          "primaryColor": "#111111",
          "secondaryColor": "#ffffff",
          "icon": "phone",
          "label": "Voice call",
          "panelTitle": "Aditi",
          "panelSubtitle": "HNM Food Group AI Receptionist",
          "launcherStyle": "pill"
        }
      };
      var script = document.createElement('script');
      script.src = 'https://api.arivulabs.ai/widget/arivu-widget.js';
      script.async = true;
      script.onload = function () {
        if (window.ArivuWidget) window.ArivuWidget.init(config);
      };
      document.body.appendChild(script);
    })();
    </script>
  </body>
</html>
