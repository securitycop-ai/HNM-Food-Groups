<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/hnm-logo.svg" />
    <title>HNM Food Groups — Organic Millet Cereals | Cardiff, Wales</title>
    <meta name="description" content="HNM Food Groups — clean-label, naturally sourced organic millet breakfast cereals crafted for modern nutritional standards. Based in Cardiff, Wales." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ArivuLabs widget — constrain to viewport */
      #arivu-widget-container,
      [id^="arivu"],
      [class^="arivu"],
      [id*="arivu-widget"],
      [class*="arivu-widget"] {
        max-width: min(380px, calc(100vw - 24px)) !important;
        right: 12px !important;
        bottom: 12px !important;
        box-sizing: border-box !important;
      }
      /* Panel specifically */
      [id*="arivu-panel"],
      [class*="arivu-panel"],
      [class*="widget-panel"],
      [class*="widgetPanel"] {
        max-width: min(360px, calc(100vw - 24px)) !important;
        max-height: calc(100vh - 100px) !important;
        right: 12px !important;
        overflow-y: auto !important;
      }
      /* Mobile — make it smaller */
      @media (max-width: 480px) {
        #arivu-widget-container,
        [id^="arivu"],
        [class^="arivu"],
        [id*="arivu-widget"],
        [class*="arivu-widget"],
        [class*="widget-panel"],
        [class*="widgetPanel"] {
          max-width: calc(100vw - 16px) !important;
          right: 8px !important;
          left: 8px !important;
          width: auto !important;
        }
      }
    </style>
  </head>
  <body className="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ArivuLabs Voice Widget -->
    <script>
    (function () {
      var config = {
        "orgSlug": "hnm-food-group",
        "agentSlug": "aditi",
        "apiUrl": "https://api.arivulabs.ai",
        "appUrl": "https://app.arivulabs.ai",
        "theme": {
          "position": "bottom-right",
          "primaryColor": "#111111",
          "secondaryColor": "#ffffff",
          "icon": "phone",
          "label": "Voice call",
          "panelTitle": "Aditi",
          "panelSubtitle": "HNM Food Group AI Receptionist",
          "launcherStyle": "pill"
        }
      };
      var script = document.createElement('script');
      script.src = 'https://api.arivulabs.ai/widget/arivu-widget.js';
      script.async = true;
      script.onload = function () {
        if (window.ArivuWidget) window.ArivuWidget.init(config);
      };
      document.body.appendChild(script);
    })();
    </script>
  </body>
</html>
