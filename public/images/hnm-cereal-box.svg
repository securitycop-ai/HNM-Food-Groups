<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="Georgia, serif">
  <defs>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d1f00"/>
      <stop offset="100%" style="stop-color:#1a0800"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4b87a"/>
      <stop offset="50%" style="stop-color:#f5e3b1"/>
      <stop offset="100%" style="stop-color:#d4b87a"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a3010"/>
      <stop offset="100%" style="stop-color:#3d1f00"/>
    </linearGradient>
    <linearGradient id="sideFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c1200"/>
      <stop offset="100%" style="stop-color:#1a0800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="6" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

